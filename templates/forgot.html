{% extends "layout.html" %}
{% block title %}{{ _('Forgot Password') }}{% endblock %}
{% block main %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-7 col-lg-5">
      <div class="text-center mb-4 reveal">
        <div class="feature-card-icon mx-auto mb-3" style="width:56px;height:56px;font-size:1.6rem;border-radius:16px">
          <i class="bi bi-envelope-at"></i>
        </div>
        <h2 class="fw-bold">{{ _('Forgot Password?') }}</h2>
        <p class="text-muted">{{ _("No worries — we'll send you a reset link.") }}</p>
      </div>
      <div class="dashboard-stat-card reveal">
        <form method="post" class="needs-validation" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">{{ _('Email Address') }}</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" required placeholder="{{ _('Enter your email') }}" autofocus />
              <div class="invalid-feedback">{{ _('Please enter a valid email address.') }}</div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 shimmer">
            <i class="bi bi-send me-2"></i>{{ _('Send Reset Link') }}
          </button>
        </form>
        <hr class="gradient-divider">
        <div class="text-center small">
          <a href="/login"><i class="bi bi-arrow-left me-1"></i>{{ _('Back to Login') }}</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){const f=document.querySelectorAll('.needs-validation');f.forEach(function(form){form.addEventListener('submit',function(e){if(!form.checkValidity()){e.preventDefault();e.stopPropagation();}form.classList.add('was-validated');},false);});})();
</script>
{% endblock %}
