{% extends "layout.html" %}
{% block title %}{{ _('404 — Not Found') }}{% endblock %}
{% block main %}
<div class="container py-5 text-center">
  <div class="reveal">
    <div class="feature-card-icon mx-auto mb-4" style="width:80px;height:80px;font-size:2.4rem;border-radius:20px">
      <i class="bi bi-compass"></i>
    </div>
    <h1 class="display-1 fw-bold gradient-text">404</h1>
    <p class="lead text-muted mb-4">{{ _("Oops! The page you're looking for doesn't exist.") }}</p>
    <a href="/" class="btn btn-primary btn-lg shimmer">
      <i class="bi bi-house me-2"></i>{{ _('Go Home') }}
    </a>
  </div>
</div>
{% endblock %}
