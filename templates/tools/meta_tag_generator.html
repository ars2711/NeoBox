{% extends "layout.html" %} {% block title %}Meta Tag Generator{% endblock %} {%
block content %}
<div class="row justify-content-center">
  <div class="col-md-9">
    <div class="glass-card fade-in p-4">
      <h2 class="mb-4 display-6 text-center">
        <i class="bi bi-code-square text-dark me-2"></i>Meta Tag Generator
      </h2>
      <p class="text-center text-muted mb-4">
        Generate SEO meta tags for your website.
      </p>

      <div class="row g-3">
        <div class="col-md-12">
          <h5 class="text-primary border-bottom pb-2">Basic Info</h5>
        </div>
        <div class="col-md-6">
          <label class="form-label">Site Title</label>
          <input
            type="text"
            id="siteTitle"
            class="form-control"
            placeholder="My Awesome Website"
            oninput="generateTags()"
          />
          <div class="form-text">Max 60 chars recommended.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Description</label>
          <textarea
            id="siteDesc"
            class="form-control"
            rows="1"
            placeholder="A brief description..."
            oninput="generateTags()"
          ></textarea>
          <div class="form-text">Max 160 chars recommended.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Keywords</label>
          <input
            type="text"
            id="siteKeywords"
            class="form-control"
            placeholder="html, css, tools"
            oninput="generateTags()"
          />
        </div>
        <div class="col-md-6">
          <label class="form-label">Author</label>
          <input
            type="text"
            id="siteAuthor"
            class="form-control"
            oninput="generateTags()"
          />
        </div>

        <div class="col-md-12 mt-4">
          <h5 class="text-primary border-bottom pb-2">
            Open Graph (Facebook/LinkedIn)
          </h5>
        </div>
        <div class="col-md-6">
          <label class="form-label">OG Title</label>
          <input
            type="text"
            id="ogTitle"
            class="form-control"
            placeholder="Same as title usually"
            oninput="generateTags()"
          />
        </div>
        <div class="col-md-6">
          <label class="form-label">OG Type</label>
          <select id="ogType" class="form-select" onchange="generateTags()">
            <option value="website">website</option>
            <option value="article">article</option>
            <option value="profile">profile</option>
          </select>
        </div>
        <div class="col-md-12">
          <label class="form-label">OG Image URL</label>
          <input
            type="text"
            id="ogImage"
            class="form-control"
            placeholder="https://example.com/image.jpg"
            oninput="generateTags()"
          />
        </div>

        <div class="col-md-12 mt-4">
          <label class="form-label fw-bold">Output HTML</label>
          <textarea
            id="outputTags"
            class="form-control font-monospace bg-light"
            rows="10"
            readonly
          ></textarea>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function generateTags() {
    const title = document.getElementById("siteTitle").value;
    const desc = document.getElementById("siteDesc").value;
    const keywords = document.getElementById("siteKeywords").value;
    const author = document.getElementById("siteAuthor").value;

    const ogTitle = document.getElementById("ogTitle").value || title;
    const ogType = document.getElementById("ogType").value;
    const ogImage = document.getElementById("ogImage").value;

    let code = `<!-- Primary Meta Tags -->\n`;
    code += `<title>${title}</title>\n`;
    code += `<meta name="title" content="${title}">\n`;
    code += `<meta name="description" content="${desc}">\n`;

    if (keywords) code += `<meta name="keywords" content="${keywords}">\n`;
    if (author) code += `<meta name="author" content="${author}">\n`;

    code += `\n<!-- Open Graph / Facebook -->\n`;
    code += `<meta property="og:type" content="${ogType}">\n`;
    code += `<meta property="og:title" content="${ogTitle}">\n`;
    code += `<meta property="og:description" content="${desc}">\n`;
    if (ogImage) code += `<meta property="og:image" content="${ogImage}">\n`;

    document.getElementById("outputTags").value = code;
  }
</script>
{% endblock %}
