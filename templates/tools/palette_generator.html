{% extends "layout.html" %} {% block title %}{{ _('Palette Generator') }}{%
endblock %} {% block main %}
<div class="container py-5">
  <div class="row mb-5 text-center fade-in-up">
    <div class="col-lg-8 mx-auto">
      <h2 class="tool-header mb-3">
        <i class="bi bi-palette-fill me-2"></i>Palette Generator
      </h2>
      <p class="text-muted">
        Generate harmonic color schemes for your designs.
      </p>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-10 fade-in-up" style="animation-delay: 0.1s">
      <div class="glass-card p-4 p-md-5 mb-5">
        <form method="post">
          <div class="row g-4 align-items-end">
            <div class="col-md-3">
              <label class="form-label text-muted small fw-bold text-uppercase"
                >Base Color</label
              >
              <input
                type="color"
                name="base"
                value="{{ base }}"
                class="form-control form-control-color w-100 rounded-pill shadow-sm cursor-pointer"
                style="height: 3rem"
                title="Choose base color"
              />
            </div>
            <div class="col-md-5">
              <label class="form-label text-muted small fw-bold text-uppercase"
                >Harmony Mode</label
              >
              <select
                name="mode"
                class="form-select form-select-lg bg-light-subtle border-0 rounded-pill shadow-sm"
              >
                <option
                  value="random"
                  {%
                  if
                  mode=""
                  ="random"
                  %}selected{%
                  endif
                  %}
                >
                  Random
                </option>
                <option
                  value="monochrome"
                  {%
                  if
                  mode=""
                  ="monochrome"
                  %}selected{%
                  endif
                  %}
                >
                  Monochrome
                </option>
                <option
                  value="complementary"
                  {%
                  if
                  mode=""
                  ="complementary"
                  %}selected{%
                  endif
                  %}
                >
                  Complementary
                </option>
                <option
                  value="analogous"
                  {%
                  if
                  mode=""
                  ="analogous"
                  %}selected{%
                  endif
                  %}
                >
                  Analogous
                </option>
                <option
                  value="triadic"
                  {%
                  if
                  mode=""
                  ="triadic"
                  %}selected{%
                  endif
                  %}
                >
                  Triadic
                </option>
                <option
                  value="tetradic"
                  {%
                  if
                  mode=""
                  ="tetradic"
                  %}selected{%
                  endif
                  %}
                >
                  Tetradic
                </option>
                <option
                  value="split-complementary"
                  {%
                  if
                  mode=""
                  ="split-complementary"
                  %}selected{%
                  endif
                  %}
                >
                  Split-Complementary
                </option>
              </select>
            </div>
            <div class="col-md-4">
              <button
                class="btn btn-neo w-100 btn-lg rounded-pill shadow-sm"
                type="submit"
              >
                <i class="bi bi-magic me-2"></i>Generate
              </button>
            </div>
          </div>
        </form>
      </div>

      {% if palette %}
      <div class="row g-3 fade-in-up" style="animation-delay: 0.2s">
        {% for color in palette %}
        <div class="col-6 col-md-4 col-lg">
          <div
            class="glass-card p-2 text-center h-100 hover-lift group-hover-btn"
          >
            <div
              class="rounded-4 mb-3 shadow-sm position-relative"
              style="background: {{ color }}; height: 120px; width: 100%;"
            >
              <!-- Overlay helpful for light colors -->
              <div
                class="position-absolute bottom-0 start-0 w-100 p-2 text-white text-shadow small opacity-0 group-hover-visible transition-opacity"
              >
                Click to copy
              </div>
            </div>
            <h5 class="font-monospace mb-2">{{ color }}</h5>
            <button
              class="btn btn-sm btn-outline-primary rounded-pill px-3"
              onclick="copyColor('{{ color }}', this)"
            >
              <i class="bi bi-clipboard"></i>
            </button>
          </div>
        </div>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </div>
</div>

<script>
  function copyColor(color, btn) {
    navigator.clipboard.writeText(color);
    const originalIcon = btn.innerHTML;
    btn.innerHTML = '<i class="bi bi-check2"></i>';
    btn.classList.add("btn-success", "text-white");
    btn.classList.remove("btn-outline-primary");

    setTimeout(() => {
      btn.innerHTML = originalIcon;
      btn.classList.remove("btn-success", "text-white");
      btn.classList.add("btn-outline-primary");
    }, 1500);
  }
</script>
<style>
  .group-hover-btn:hover .group-hover-visible {
    opacity: 1;
  }
  .text-shadow {
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  }
  .hover-lift {
    transition: transform 0.2s;
  }
  .hover-lift:hover {
    transform: translateY(-5px);
  }
</style>
{% endblock %}
