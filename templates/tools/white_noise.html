{% extends "layout.html" %} {% block title %}{{ _('White Noise Generator') }}{%
endblock %} {% block main %}
<div class="container py-5">
  <div class="row mb-5 text-center fade-in-up">
      <div class="col-lg-8 mx-auto">
           <h2 class="tool-header mb-3"><i class="bi bi-soundwave me-2"></i>White Noise Generator</h2>
           <p class="text-muted">Mix ambient sounds to create your perfect focus environment.</p>
      </div>
  </div>

  <div class="row justify-content-center">
    <!-- Sound List -->
    <div class="col-lg-4 mb-4 fade-in-up" style="animation-delay: 0.1s;">
        <div class="glass-card p-3 h-100 d-flex flex-column" style="max-height: 700px;">
            <div class="mb-3">
                 <input
                   type="text"
                   class="form-control rounded-pill"
                   id="wn-search"
                   placeholder="{{ _('Search sounds...') }}"
                   aria-label="{{ _('Search sounds') }}"
                 />
            </div>
            
            <div class="flex-grow-1 overflow-auto pe-2" id="wn-sound-list">
              <!-- JS Populated -->
            </div>
        </div>
    </div>
    
    <!-- Mix Area -->
    <div class="col-lg-8 mb-4 fade-in-up" style="animation-delay: 0.2s;">
        <div class="glass-card p-4 h-100">
            <div class="wn-mix-header d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
              <h5 class="fw-bold mb-0 text-primary">Your Mix</h5>
              
              <div class="wn-mix-global-controls d-flex align-items-center gap-2">
                <button
                  class="btn btn-primary rounded-circle shadow-sm"
                  id="wn-play-all"
                  title="{{ _('Play/Pause all') }}"
                >
                  <i class="bi bi-play-fill" id="wn-play-all-icon"></i>
                </button>
                <button
                  class="btn btn-outline-danger btn-sm rounded-circle"
                  id="wn-stop-all"
                  title="{{ _('Stop all') }}"
                >
                  <i class="bi bi-stop-circle"></i>
                </button>
                
                <div class="bg-light rounded-pill px-3 py-1 ms-2 d-flex align-items-center gap-2">
                    <i class="bi bi-volume-down text-muted"></i>
                    <input
                      type="range"
                      min="0"
                      max="1"
                      step="0.01"
                      value="0.7"
                      id="wn-global-volume"
                      class="form-range"
                      style="width: 80px"
                    />
                </div>
              </div>
            </div>
            
            <div id="wn-mix-list" class="wn-mix-list vstack gap-3">
                 <!-- JS Populated -->
            </div>
            
            <div id="wn-mix-empty" class="text-center py-5 text-muted opacity-50">
               <i class="bi bi-music-note-list display-1 mb-3 d-block"></i>
               {{ _('No sounds in your mix. Add some from the left!') }}
            </div>
        </div>
    </div>
  </div>
</div>

<style>
/* Custom Styles specific to White Noise */
.wn-sound-list-item {
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    background: rgba(255,255,255,0.5);
    transition: all 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid transparent;
}
.wn-sound-list-item:hover {
    background: white;
    border-color: var(--bs-primary-border-subtle);
    transform: translateX(5px);
}
.wn-sound-btn {
    border: none; background: none; text-align: left; padding: 0;
    display: flex; align-items: center; gap: 10px; flex-grow: 1;
}
.wn-sound-desc { display: none; }
.wn-sound-hover-icons {
    opacity: 0; transition: opacity 0.2s; display: flex; gap: 5px;
}
.wn-sound-list-item:hover .wn-sound-hover-icons { opacity: 1; }

.wn-mix-card.glass-card {
    /* Override for inner cards if needed, but glass-card class handles most */
    background: white;
}
.wn-mix-icon {
    width: 40px; height: 40px;
    background: var(--bs-primary-bg-subtle);
    color: var(--bs-primary);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
}
</style>

<script>
  const wnSounds = {{ sounds|tojson }};
  const ambientLoops = {};
  wnSounds.forEach(snd => { if (snd.file) ambientLoops[snd.key] = "/static/media/" + snd.file; });
  function _(s) { return s; } 

  let mix = {}; 
  let globalVolume = 0.7;

  function renderSoundList(filter = "") {
    const list = document.getElementById('wn-sound-list');
    list.innerHTML = '';
    let found = false;
    wnSounds.forEach(snd => {
      if (filter && !((snd.name+snd.desc).toLowerCase().includes(filter.toLowerCase()))) return;
      found = true;
      const item = document.createElement('div');
      item.className = 'wn-sound-list-item';
      
      const btn = document.createElement('button');
      btn.className = 'wn-sound-btn text-dark text-decoration-none';
      btn.innerHTML = `<i class="bi ${snd.icon} fs-5 text-primary"></i> <span class="fw-medium">${snd.name}</span>`;
      
      const hover = document.createElement('div');
      hover.className = 'wn-sound-hover-icons';
      
      const addBtn = document.createElement('button');
      addBtn.className = 'btn btn-sm btn-light text-primary rounded-circle border';
      addBtn.innerHTML = '<i class="bi bi-plus-lg"></i>';
      addBtn.onclick = (e) => { e.stopPropagation(); addToMix(snd.key); };
      
      const playBtn = document.createElement('button');
      playBtn.className = 'btn btn-sm btn-light text-success rounded-circle border';
      playBtn.innerHTML = '<i class="bi bi-play-fill"></i>';
      playBtn.onclick = (e) => { e.stopPropagation(); addToMix(snd.key, true); };
      
      hover.appendChild(addBtn);
      hover.appendChild(playBtn);
      item.appendChild(btn);
      item.appendChild(hover);
      
      item.onclick = () => addToMix(snd.key);
      list.appendChild(item);
    });
    if (!found) {
        list.innerHTML = `<div class='text-muted text-center py-4 small'>No sounds found.</div>`;
    }
  }

  function renderMixList() {
    const mixList = document.getElementById('wn-mix-list');
    const empty = document.getElementById('wn-mix-empty');
    mixList.innerHTML = '';
    const keys = Object.keys(mix);
    if (!keys.length) {
      empty.classList.remove('d-none');
      return;
    }
    empty.classList.add('d-none');
    keys.forEach(key => {
      const snd = wnSounds.find(s=>s.key===key);
      const m = mix[key];
      
      const card = document.createElement('div');
      card.className = 'glass-card p-3 d-flex align-items-center gap-3 animate__animated animate__fadeIn'; /* UPDATED CLASS */
      
      const icon = document.createElement('div');
      icon.className = 'wn-mix-icon flex-shrink-0';
      icon.innerHTML = `<i class="bi ${snd.icon}"></i>`;
      card.appendChild(icon);
      
      // Info
      const info = document.createElement('div');
      info.className = 'flex-grow-1';
      info.innerHTML = `<div class=\"fw-bold text-dark\">${snd.name}</div>`;
      
      // Sliders Container
      const sliders = document.createElement('div');
      sliders.className = 'd-flex gap-3 align-items-center mt-1';
      
      // Vol
      const volContainer = document.createElement('div');
      volContainer.className = 'd-flex align-items-center gap-1';
      volContainer.innerHTML = '<i class=\"bi bi-volume-down text-muted small\"></i>';
      const vol = document.createElement('input');
      vol.type = 'range'; vol.min = 0; vol.max = 1; vol.step = 0.01; vol.value = m.volume;
      vol.className = 'form-range';
      vol.style.width = '60px';
      vol.oninput = () => setVolume(key, parseFloat(vol.value));
      volContainer.appendChild(vol);
      sliders.appendChild(volContainer);
      
      info.appendChild(sliders);
      card.appendChild(info);
      
      // Controls
      const controls = document.createElement('div');
      controls.className = 'd-flex gap-1';
      
      const playBtn = document.createElement('button');
      playBtn.className = m.playing ? 'btn btn-primary btn-sm rounded-circle' : 'btn btn-outline-primary btn-sm rounded-circle';
      playBtn.innerHTML = m.playing ? '<i class="bi bi-pause-fill"></i>' : '<i class="bi bi-play-fill"></i>';
      playBtn.onclick = () => togglePlay(key);
      controls.appendChild(playBtn);
      
      const removeBtn = document.createElement('button');
      removeBtn.className = 'btn btn-outline-danger btn-sm rounded-circle';
      removeBtn.innerHTML = '<i class="bi bi-x-lg"></i>';
      removeBtn.onclick = () => removeFromMix(key);
      controls.appendChild(removeBtn);
      
      card.appendChild(controls);
      mixList.appendChild(card);
    });
  }

  // --- Logic PRESERVED ---
  function addToMix(key, playNow=false) {
    if (mix[key]) {
      if (playNow) togglePlay(key, true);
      return;
    }
    const snd = wnSounds.find(s=>s.key===key);
    if (!snd) return;
    if (ambientLoops[key]) {
      fetch(ambientLoops[key], {method: 'HEAD'}).then(resp => {
        if (resp.ok) {
          const audio = new Audio(ambientLoops[key]);
          audio.loop = true;
          audio.volume = globalVolume;
          audio.playbackRate = 1;
          mix[key] = { audio, playing: false, volume: 0.7, speed: 1 };
          audio.onended = () => { mix[key].playing = false; renderMixList(); };
          if (playNow) togglePlay(key, true);
          renderMixList();
        } else {
          alert(_('Audio file not found for: ') + snd.name);
        }
      });
    } else if (["white","pink","brown"].includes(key)) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      let bufferSize = 2 * ctx.sampleRate,
        noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate),
        output = noiseBuffer.getChannelData(0);
      if (key === "white") {
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
      } else if (key === "pink") {
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
          let white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.969 * b2 + white * 0.153852;
          b3 = 0.8665 * b3 + white * 0.3104856;
          b4 = 0.55 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.016898;
          output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
          output[i] *= 0.11;
          b6 = white * 0.115926;
        }
      } else if (key === "brown") {
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          let white = Math.random() * 2 - 1;
          output[i] = (lastOut + 0.02 * white) / 1.02;
          lastOut = output[i];
          output[i] *= 3.5;
        }
      }
      const node = ctx.createBufferSource();
      node.buffer = noiseBuffer;
      node.loop = true;
      const gain = ctx.createGain();
      gain.gain.value = 0.7 * globalVolume;
      node.connect(gain).connect(ctx.destination);
      mix[key] = { ctx, node, gain, playing: false, volume: 0.7, speed: 1 };
      if (playNow) togglePlay(key, true);
      renderMixList();
    }
  }

  function togglePlay(key, forcePlay=false) {
    const m = mix[key];
    if (!m) return;
    if (ambientLoops[key]) {
      if (!m.playing || forcePlay) {
        m.audio.volume = m.volume * globalVolume;
        m.audio.playbackRate = m.speed;
        m.audio.play();
        m.playing = true;
      } else {
        m.audio.pause();
        m.playing = false;
      }
    } else if (["white","pink","brown"].includes(key)) {
      if (!m.playing || forcePlay) {
        m.node.playbackRate.value = m.speed;
        m.gain.gain.value = m.volume * globalVolume;
        m.node.start(0);
        m.playing = true;
      } else {
        try { m.node.stop(); } catch(e){}
        m.playing = false;
        // Recreate node for replay
        addToMix(key);
      }
    }
    renderMixList();
    updatePlayAllButton();
  }

  function stopSound(key) {
    const m = mix[key];
    if (!m) return;
    if (ambientLoops[key]) {
      m.audio.pause();
      m.audio.currentTime = 0;
      m.playing = false;
    } else if (["white","pink","brown"].includes(key)) {
      try { m.node.stop(); } catch(e){}
      m.playing = false;
      if (m.ctx) { m.ctx.close(); }
      // Recreate node for replay
      addToMix(key);
    }
    renderMixList();
    updatePlayAllButton();
  }

  function removeFromMix(key) {
    stopSound(key);
    if (mix[key]) {
      if (ambientLoops[key]) {
        mix[key].audio = null;
      } else if (["white","pink","brown"].includes(key)) {
        if (mix[key].ctx) mix[key].ctx.close();
      }
      delete mix[key];
    }
    renderMixList();
    updatePlayAllButton();
  }

  function setVolume(key, vol) {
    const m = mix[key];
    if (!m) return;
    m.volume = vol;
    if (ambientLoops[key]) {
      m.audio.volume = vol * globalVolume;
    } else if (["white","pink","brown"].includes(key)) {
      m.gain.gain.value = vol * globalVolume;
    }
  }

  function setSpeed(key, speed) {
      /* Not implemented in simplified UI */
  }

  function setGlobalVolume(vol) {
    globalVolume = vol;
    Object.keys(mix).forEach(key => setVolume(key, mix[key].volume));
  }

  function stopAll() {
    Object.keys(mix).forEach(key => stopSound(key));
  }

  function playAll() {
    Object.keys(mix).forEach(key => {
      if (!mix[key].playing) togglePlay(key, true);
    });
  }

  function pauseAll() {
    Object.keys(mix).forEach(key => {
      if (mix[key].playing) togglePlay(key, false);
    });
  }

  function updatePlayAllButton() {
    const playAllBtn = document.getElementById('wn-play-all');
    const playAllIcon = document.getElementById('wn-play-all-icon');
    const anyPlaying = Object.values(mix).some(m => m.playing);
    if (anyPlaying) {
      playAllIcon.className = 'bi bi-pause-fill';
    } else {
      playAllIcon.className = 'bi bi-play-fill';
    }
  }

  document.getElementById('wn-search').addEventListener('input', function() {
    renderSoundList(this.value);
  });
  document.getElementById('wn-global-volume').addEventListener('input', function() {
    setGlobalVolume(parseFloat(this.value));
  });
  document.getElementById('wn-stop-all').addEventListener('click', stopAll);
  document.getElementById('wn-play-all').addEventListener('click', function() {
    const anyPlaying = Object.values(mix).some(m => m.playing);
    if (anyPlaying) pauseAll();
    else playAll();
    updatePlayAllButton();
  });
  window.addEventListener('DOMContentLoaded', function() {
    renderSoundList();
    renderMixList();
    updatePlayAllButton();
  });
</script>
{% endblock %}
