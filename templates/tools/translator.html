{% extends "layout.html" %} {% block title %}{{ _('Text Translator') }}{% endblock %}
{% block main %}
<div class="container py-5">
    <div class="row mb-5 text-center fade-in-up">
        <div class="col-lg-8 mx-auto">
             <h2 class="tool-header mb-3"><i class="bi bi-translate me-2"></i>{{ _('Text Translator') }}</h2>
             <p class="text-muted">{{ _('Translate text between multiple languages instantly.') }}</p>
        </div>
    </div>

  <div class="row justify-content-center">
    <div class="col-lg-10 fade-in-up" style="animation-delay: 0.1s;">
      <div class="glass-card p-4 p-md-5">
        <form method="post">
            <div class="row g-3 mb-4 align-items-center">
                <div class="col-md-5">
                    <label class="form-label small fw-bold text-muted">{{ _('From') }}</label>
                    <select name="src" class="form-select border-0 shadow-sm ps-3 py-2 bg-light">
                        <option value="auto" {% if src == "auto" %}selected{% endif %}>{{ _('Auto-Detect') }}</option>
                        {% for code, lang in language_choices %}
                        <option value="{{ code }}" {% if src == code %}selected{% endif %}>{{ lang }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-2 text-center">
                    <button type="button" class="btn btn-outline-primary rounded-circle shadow-sm mt-4" onclick="swapLangs()"><i class="bi bi-arrow-left-right"></i></button>
                </div>
                
                <div class="col-md-5">
                    <label class="form-label small fw-bold text-muted">{{ _('To') }}</label>
                    <select name="dest" class="form-select border-0 shadow-sm ps-3 py-2 bg-light">
                         {% for code, lang in language_choices %}
                        <option value="{{ code }}" {% if dest == code %}selected{% endif %}>{{ lang }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="row g-4">
                <div class="col-md-6">
                    <textarea name="text" class="form-control form-control-lg border-0 bg-light shadow-inner p-3 h-100" rows="8" placeholder="{{ _('Enter text to translate...') }}">{{ text if text else '' }}</textarea>
                </div>
                <div class="col-md-6 position-relative">
                    <div class="bg-primary bg-opacity-10 border border-primary border-opacity-25 rounded-3 p-3 h-100 shadow-inner d-flex flex-column">
                         <div class="flex-grow-1 font-monospace text-dark" style="white-space: pre-wrap;">{{ result if result else '' }}</div>
                         <div class="text-end mt-2">
                             <button type="button" class="btn btn-sm btn-light shadow-sm" onclick="navigator.clipboard.writeText(this.parentElement.previousElementSibling.innerText)">Copy</button>
                         </div>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-neo px-5 rounded-pill shadow-lg">
                    {{ _('Translate') }} <i class="bi bi-arrow-right-circle ms-2"></i>
                </button>
            </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
    function swapLangs() {
        // Logic to swap select values would go here if needed client-side
        // Or users can just re-select
    }
</script>
{% endblock %}
