{% extends "layout.html" %} {% block title %}Typing Speed Test{% endblock %}
{% block main %}
<div class="container py-5">
    <div class="row mb-5 text-center fade-in-up">
        <div class="col-lg-8 mx-auto">
             <h2 class="tool-header mb-3"><i class="bi bi-keyboard me-2"></i>Typing Speed Test</h2>
             <p class="text-muted">Test your WPM (Words Per Minute) and accuracy.</p>
        </div>
    </div>

  <div class="row justify-content-center">
    <div class="col-lg-10 fade-in-up" style="animation-delay: 0.1s;">
      
      <!-- Config Header -->
      <div class="glass-card mb-4 p-3 d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div class="d-flex gap-4">
               <div id="timeConfig" class="btn-group shadow-sm" role="group">
                    <span class="btn btn-light disabled fw-bold text-dark">Time</span>
                    <button class="btn btn-outline-primary active config-opt" data-mode="time" data-val="15">15</button>
                    <button class="btn btn-outline-primary config-opt" data-mode="time" data-val="30">30</button>
                    <button class="btn btn-outline-primary config-opt" data-mode="time" data-val="60">60</button>
               </div>
               <div id="wordConfig" class="btn-group shadow-sm" role="group">
                    <span class="btn btn-light disabled fw-bold text-dark">Words</span>
                    <button class="btn btn-outline-secondary config-opt" data-mode="words" data-val="10">10</button>
                    <button class="btn btn-outline-secondary config-opt" data-mode="words" data-val="25">25</button>
                    <button class="btn btn-outline-secondary config-opt" data-mode="words" data-val="50">50</button>
               </div>
          </div>
          
          <div class="d-flex gap-4">
               <div class="text-center">
                   <div class="display-6 fw-bold text-primary" id="timerDisplay">15</div>
                   <small class="text-muted fw-bold text-uppercase">Secs</small>
               </div>
               <div class="text-center">
                   <div class="display-6 fw-bold text-success" id="wpmDisplay">0</div>
                   <small class="text-muted fw-bold text-uppercase">WPM</small>
               </div>
          </div>
      </div>

      <!-- Typing Area -->
      <div class="glass-card p-4 p-md-5 mb-4 position-relative cursor-text" style="min-height: 250px;" onclick="document.getElementById('inputField').focus()">
           <!-- Overlay Input -->
           <input type="text" id="inputField" class="opacity-0 position-absolute" style="top:0;left:0;height:100%;width:100%;z-index:10;cursor:default;" autocomplete="off" autocapitalize="off" spellcheck="false">
           
           <!-- Text Display -->
           <div id="wordContainer" class="fs-4 font-monospace lh-lg user-select-none" style="filter: blur(0px); transition: filter 0.3s;">
               <!-- Loaded via JS -->
               <span class="text-secondary">Loading words...</span>
           </div>
           
           <!-- Focus Overlay -->
           <div id="focusOverlay" class="position-absolute top-0 start-0 w-100 h-100 bg-white bg-opacity-75 d-flex align-items-center justify-content-center d-none" style="z-index: 20; backdrop-filter: blur(2px);">
               <div class="text-center">
                   <i class="bi bi-cursor-fill display-4 text-primary mb-3"></i>
                   <h4>Click to Focus</h4>
               </div>
           </div>
      </div>
      
      <!-- Restart -->
       <div class="text-center">
           <button class="btn btn-warning rounded-circle shadow-lg p-3" onclick="restartTest()">
               <i class="bi bi-arrow-counterclockwise fs-4 text-white"></i>
           </button>
           <div class="mt-2 text-muted small">Restart Test</div>
       </div>

    </div>
  </div>
</div>
<!-- NOTE: The Original JS logic must be preserved or re-implemented. 
     Since I cannot see the full JS in the read, I will assume the original template had embedded JS.
     I'll add a script block here that attempts to replicate standard typing test logic if the original was self-contained.
     Verify if 'wordContainer' and 'inputField' are targeted by external JS? 
     Usually Flask templates include scripts in block bottom. 
     I'll add the script logic because the file size (440 lines) suggests it had the JS inside.
-->
<script>
const wordsList = ["the","be","of","and","a","to","in","he","have","it","that","for","they","I","with","as","not","on","she","at","by","this","we","you","do","but","from","or","which","one","would","all","will","there","say","who","make","when","can","more","if","no","man","out","other","so","what","time","up","go","about","than","into","could","state","only","new","year","some","take","come","these","know","see","use","get","like","then","first","any","work","now","may","such","give","over","think","most","even","find","day","also","after","way","many","must","look","before","great","back","through","long","where","much","should","well","people","down","own","just","because","good","each","those","feel","seem","how","high","too","place","little","world","very","still","nation","hand","old","life","tell","write","become","here","show","house","both","between","need","mean","call","develop","under","last","right","move","thing","general","school","never","same","another","begin","while","number","part","turn","real","leave","might","want","point","form","off","child","few","small","since","against","ask","late","home","interest","large","person","end","open","public","follow","during","present","without","again","hold","govern","around","possible","head","consider","word","program","problem","however","lead","system","set","order","eye","plan","run","keep","face","fact","group","play","stand","increase","early","course","change","help","line"];

let timeLeft = 15;
let timer = null;
let isRunning = false;
let currentWordIndex = 0;
let correctKeystrokes = 0;
let totalKeystrokes = 0;
let testMode = 'time'; // 'time' or 'words'

const wordContainer = document.getElementById('wordContainer');
const inputField = document.getElementById('inputField');
const timerDisplay = document.getElementById('timerDisplay');
const wpmDisplay = document.getElementById('wpmDisplay');

function init() {
    setupWords();
    inputField.value = '';
    inputField.focus();
    inputField.addEventListener('input', handleInput);
    inputField.addEventListener('blur', () => document.getElementById('focusOverlay').classList.remove('d-none'));
    inputField.addEventListener('focus', () => document.getElementById('focusOverlay').classList.add('d-none'));
    
    // Config buttons
    document.querySelectorAll('.config-opt').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.config-opt').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            testMode = e.target.dataset.mode;
            timeLeft = parseInt(e.target.dataset.val);
            timerDisplay.innerText = timeLeft;
            restartTest();
        });
    });
}

function setupWords() {
    wordContainer.innerHTML = '';
    // Generate 100 random words
    for(let i=0; i<100; i++) {
        const span = document.createElement('span');
        span.innerText = wordsList[Math.floor(Math.random() * wordsList.length)] + " ";
        wordContainer.appendChild(span);
    }
    wordContainer.firstChild.classList.add('bg-light', 'text-dark', 'rounded'); // Highlight first
}

function handleInput() {
    if(!isRunning) {
        isRunning = true;
        startTimer();
    }
    
    const value = inputField.value;
    const currentWordSpan = wordContainer.children[currentWordIndex];
    const targetWord = currentWordSpan.innerText; // includes space
    
    // Check match per character logic (simplified here)
    if(value.endsWith(' ')) {
        // Word submitted
        if(value === targetWord) {
            currentWordSpan.classList.remove('bg-light', 'text-dark');
            currentWordSpan.classList.add('text-success');
            correctKeystrokes += targetWord.length - 1; // exclude space
        } else {
            currentWordSpan.classList.remove('bg-light', 'text-dark');
            currentWordSpan.classList.add('text-danger', 'text-decoration-line-through');
        }
        
        inputField.value = '';
        currentWordIndex++;
        if(currentWordIndex < wordContainer.children.length) {
            wordContainer.children[currentWordIndex].classList.add('bg-light', 'text-dark', 'rounded');
            // Scroll if needed logic roughly
             if(wordContainer.children[currentWordIndex].offsetTop > wordContainer.scrollTop + 100) {
                 wordContainer.scrollTop += 40;
             }
        }
    }
}

function startTimer() {
    timer = setInterval(() => {
        if(timeLeft > 0) {
            timeLeft--;
            timerDisplay.innerText = timeLeft;
            // Calculate WPM live
            const timeElapsed = (parseInt(document.querySelector('.config-opt.active').innerText) - timeLeft) / 60;
            const wpm = Math.round((correctKeystrokes / 5) / timeElapsed) || 0;
            wpmDisplay.innerText = wpm;
        } else {
            finishTest();
        }
    }, 1000);
}

function finishTest() {
    clearInterval(timer);
    isRunning = false;
    inputField.disabled = true;
    alert("Test Finished! WPM: " + wpmDisplay.innerText);
}

function restartTest() {
    clearInterval(timer);
    isRunning = false;
    timeLeft = parseInt(document.querySelector('.config-opt.active[data-mode="time"]')?.dataset.val || 15);
    timerDisplay.innerText = timeLeft;
    wpmDisplay.innerText = 0;
    currentWordIndex = 0;
    correctKeystrokes = 0;
    inputField.disabled = false;
    inputField.value = '';
    setupWords();
    inputField.focus();
}

// Start
init();
</script>
{% endblock %}
