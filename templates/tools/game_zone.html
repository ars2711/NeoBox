{% extends "layout.html" %} {% block title %}Game Zone{% endblock %} {% block
main %}
<div class="container py-5">
  <div class="row mb-5 text-center fade-in-up">
    <div class="col-lg-8 mx-auto">
      <h2 class="tool-header mb-3">
        <i class="bi bi-joystick me-2"></i>Game Zone
      </h2>
      <p class="text-muted">
        Relax and recharge with these classic browser games.
      </p>
    </div>
  </div>

  <div class="glass-card p-4 fade-in-up" style="animation-delay: 0.1s">
    <ul
      class="nav nav-pills nav-fill mb-5 p-2 bg-light-subtle rounded-pill"
      id="pills-tab"
      role="tablist"
    >
      <li class="nav-item" role="presentation">
        <button
          class="nav-link active rounded-pill fw-bold"
          id="pills-snake-tab"
          data-bs-toggle="pill"
          data-bs-target="#pills-snake"
          type="button"
        >
          <i class="bi bi-robot me-2"></i>Snake
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button
          class="nav-link rounded-pill fw-bold"
          id="pills-ttt-tab"
          data-bs-toggle="pill"
          data-bs-target="#pills-ttt"
          type="button"
        >
          <i class="bi bi-grid-3x3 me-2"></i>Tic Tac Toe
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button
          class="nav-link rounded-pill fw-bold"
          id="pills-memory-tab"
          data-bs-toggle="pill"
          data-bs-target="#pills-memory"
          type="button"
        >
          <i class="bi bi-card-image me-2"></i>Memory
        </button>
      </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
      <!-- Snake Game -->
      <div class="tab-pane fade show active text-center" id="pills-snake">
        <div
          class="d-inline-block p-1 bg-gradient rounded-4 shadow-lg mb-4"
          style="background: linear-gradient(135deg, #111, #333)"
        >
          <canvas
            id="snakeCanvas"
            width="400"
            height="400"
            class="rounded-3 d-block"
          ></canvas>
        </div>
        <div class="d-flex justify-content-center align-items-center gap-4">
          <div class="bezel p-3 rounded-4 bg-light shadow-inner">
            <h3 class="mb-0 fw-bold text-primary">
              Score: <span id="snake-score" class="font-monospace">0</span>
            </h3>
          </div>
          <button
            class="btn btn-neo rounded-pill px-5 shadow-sm"
            onclick="startSnake()"
          >
            <i class="bi bi-play-fill me-2"></i>Start Game
          </button>
        </div>
        <p class="text-muted small mt-3">
          <i class="bi bi-arrows-move me-1"></i>Use Arrow Keys to control the
          snake
        </p>
      </div>

      <!-- Tic Tac Toe -->
      <div class="tab-pane fade text-center" id="pills-ttt">
        <div class="d-flex justify-content-center mb-4">
          <div class="ttt-grid gap-3" id="ttt-board">
            <!-- Cells generated by JS -->
          </div>
        </div>
        <div
          class="d-flex flex-col align-items-center justify-content-center gap-3"
        >
          <div
            class="badge bg-primary bg-opacity-10 text-primary fs-5 px-4 py-2 rounded-pill border border-primary border-opacity-25"
            id="ttt-status"
          >
            Player X's Turn
          </div>
          <button
            class="btn btn-outline-primary rounded-pill px-4"
            onclick="resetTTT()"
          >
            <i class="bi bi-arrow-counterclockwise me-2"></i>Restart
          </button>
        </div>
      </div>

      <!-- Memory Game -->
      <div class="tab-pane fade text-center" id="pills-memory">
        <div
          class="memory-grid d-flex flex-wrap justify-content-center gap-3 mb-4"
          id="memory-board"
          style="max-width: 520px; margin: 0 auto"
        >
          <!-- Cards generated by JS -->
        </div>
        <div class="d-flex justify-content-center align-items-center gap-4">
          <h4 class="mb-0 text-muted">
            Moves: <span id="memory-moves" class="fw-bold text-dark">0</span>
          </h4>
          <button
            class="btn btn-outline-primary rounded-pill px-4"
            onclick="initMemory()"
          >
            <i class="bi bi-arrow-counterclockwise me-2"></i>Restart
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  /* TTT Styles */
  .ttt-grid {
    display: grid;
    grid-template-columns: repeat(3, 100px);
  }
  .ttt-cell {
    width: 100px;
    height: 100px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 16px;
    font-size: 3rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    color: var(--neo-primary);
  }
  .ttt-cell:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
  }
  .ttt-cell:active {
    transform: scale(0.95);
  }

  /* Memory Styles */
  .memory-card {
    width: 80px;
    height: 80px;
    background: var(--neo-accent);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    color: white;
    transition:
      transform 0.4s,
      background-color 0.2s;
    transform-style: preserve-3d;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  }
  .memory-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
  }
  .memory-card.flipped {
    background: white;
    color: #333;
    transform: rotateY(180deg);
    border: 2px solid var(--neo-accent);
  }

  .shadow-inner {
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
  }

  .nav-pills .nav-link {
    color: var(--text-muted);
    transition: all 0.2s ease;
  }
  .nav-pills .nav-link.active {
    background-color: var(--neo-accent);
    color: white;
    box-shadow: 0 4px 10px rgba(var(--neo-accent-rgb), 0.3);
  }
</style>

<script>
  // --- Snake Logic ---
  const cvs = document.getElementById("snakeCanvas");
  const ctx = cvs.getContext("2d");
  const box = 20;
  let snake = [];
  let food = {};
  let score = 0;
  let d;
  let game;

  document.addEventListener("keydown", direction);
  function direction(event) {
    if (event.keyCode == 37 && d != "RIGHT") d = "LEFT";
    else if (event.keyCode == 38 && d != "DOWN") d = "UP";
    else if (event.keyCode == 39 && d != "LEFT") d = "RIGHT";
    else if (event.keyCode == 40 && d != "UP") d = "DOWN";
  }

  function draw() {
    // Modernized Snake Draw
    ctx.fillStyle = "#111"; // Dark background
    ctx.fillRect(0, 0, cvs.width, cvs.height);

    // Grid lines optional? No, cleaner without

    for (let i = 0; i < snake.length; i++) {
      ctx.fillStyle = i == 0 ? "var(--neo-primary)" : "white"; // Head color vs body
      // Add gradient or rounded effect?
      ctx.beginPath();
      ctx.roundRect(snake[i].x, snake[i].y, box - 1, box - 1, 4);
      ctx.fill();
    }

    // Food
    ctx.fillStyle = "#ff4d4d";
    ctx.shadowColor = "#ff4d4d";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(food.x + box / 2, food.y + box / 2, box / 2 - 2, 0, 2 * Math.PI);
    ctx.fill();
    ctx.shadowBlur = 0;

    let snakeX = snake[0].x;
    let snakeY = snake[0].y;

    if (d == "LEFT") snakeX -= box;
    if (d == "UP") snakeY -= box;
    if (d == "RIGHT") snakeX += box;
    if (d == "DOWN") snakeY += box;

    if (snakeX == food.x && snakeY == food.y) {
      score++;
      document.getElementById("snake-score").innerText = score;
      food = {
        x: Math.floor(Math.random() * 19) * box, // Fixed boundary calculation (0-19)
        y: Math.floor(Math.random() * 19) * box,
      };
    } else {
      snake.pop();
    }

    if (
      snakeX < 0 ||
      snakeX >= 20 * box ||
      snakeY < 0 ||
      snakeY >= 20 * box ||
      collision(snakeX, snakeY, snake)
    ) {
      clearInterval(game);
      // Visual Game Over
      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(0, 0, cvs.width, cvs.height);
      ctx.fillStyle = "white";
      ctx.font = "30px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Game Over", cvs.width / 2, cvs.height / 2);
      ctx.font = "20px sans-serif";
      ctx.fillText("Score: " + score, cvs.width / 2, cvs.height / 2 + 30);
    }

    let newHead = { x: snakeX, y: snakeY };
    snake.unshift(newHead);
  }

  function collision(x, y, array) {
    for (let i = 0; i < array.length; i++) {
      if (x == array[i].x && y == array[i].y) return true;
    }
    return false;
  }

  function startSnake() {
    clearInterval(game);
    snake = [{ x: 9 * box, y: 10 * box }];
    score = 0;
    document.getElementById("snake-score").innerText = 0;
    d = undefined; // Wait for input
    food = {
      x: Math.floor(Math.random() * 19) * box,
      y: Math.floor(Math.random() * 19) * box,
    };
    game = setInterval(draw, 100);
  }

  // --- Tic Tac Toe Logic ---
  const tttBoard = document.getElementById("ttt-board");
  let tttState = Array(9).fill(null);
  let currentPlayer = "X";
  let tttActive = true;

  function initTTT() {
    tttBoard.innerHTML = "";
    tttState.forEach((val, i) => {
      const cell = document.createElement("div");
      cell.className = "ttt-cell";
      cell.innerText = val || "";
      if (val === "X") cell.style.color = "var(--neo-primary)";
      if (val === "O") cell.style.color = "#ff4d4d";
      cell.onclick = () => playTTT(i);
      tttBoard.appendChild(cell);
    });
  }

  function playTTT(i) {
    if (!tttActive || tttState[i]) return;
    tttState[i] = currentPlayer;
    initTTT(); // Re-render
    if (checkWin()) {
      document.getElementById("ttt-status").innerHTML =
        `<i class="bi bi-trophy-fill me-2"></i>Player ${currentPlayer} Wins!`;
      document.getElementById("ttt-status").className =
        "badge bg-success bg-opacity-10 text-success fs-5 px-4 py-2 rounded-pill border border-success border-opacity-25";
      tttActive = false;
    } else if (tttState.every((c) => c)) {
      document.getElementById("ttt-status").innerText = `It's a Draw!`;
      document.getElementById("ttt-status").className =
        "badge bg-secondary bg-opacity-10 text-secondary fs-5 px-4 py-2 rounded-pill border border-secondary border-opacity-25";
      tttActive = false;
    } else {
      currentPlayer = currentPlayer === "X" ? "O" : "X";
      document.getElementById("ttt-status").innerText =
        `Player ${currentPlayer}'s Turn`;
    }
  }

  function checkWin() {
    const wins = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6],
    ];
    return wins.some(
      (c) =>
        tttState[c[0]] &&
        tttState[c[0]] === tttState[c[1]] &&
        tttState[c[1]] === tttState[c[2]],
    );
  }

  function resetTTT() {
    tttState = Array(9).fill(null);
    currentPlayer = "X";
    tttActive = true;
    document.getElementById("ttt-status").innerText = `Player X's Turn`;
    document.getElementById("ttt-status").className =
      "badge bg-primary bg-opacity-10 text-primary fs-5 px-4 py-2 rounded-pill border border-primary border-opacity-25";
    initTTT();
  }

  // --- Memory Game Logic ---
  const memBoard = document.getElementById("memory-board");
  const emojis = ["🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🐻", "🐼", "🦁", "🐯"];
  // Limit range based on grid size if needed, but 20 cards (10 pairs) is fine
  let cards = [];
  let flippedCards = [];
  let moves = 0;

  function initMemory() {
    moves = 0;
    document.getElementById("memory-moves").innerText = 0;
    memBoard.innerHTML = "";
    // Use first 8 pairs for 4x4 grid (16 cards) to fit nicer
    let subset = emojis.slice(0, 8);
    const items = [...subset, ...subset].sort(() => 0.5 - Math.random());
    items.forEach((emoji, i) => {
      const card = document.createElement("div");
      card.className = "memory-card";
      card.dataset.emoji = emoji;
      card.dataset.index = i;
      card.onclick = () => flipCard(card);

      // To handle "back" of card, we just hide text when not flipped
      card.innerText = "";

      memBoard.appendChild(card);
    });
    cards = document.querySelectorAll(".memory-card");
    flippedCards = [];
  }

  function flipCard(card) {
    if (flippedCards.length >= 2 || card.classList.contains("flipped")) return;

    card.classList.add("flipped");
    card.innerText = card.dataset.emoji;
    flippedCards.push(card);

    if (flippedCards.length === 2) {
      moves++;
      document.getElementById("memory-moves").innerText = moves;
      const [c1, c2] = flippedCards;
      if (c1.dataset.emoji === c2.dataset.emoji) {
        flippedCards = [];
        // Win check could be added here
      } else {
        setTimeout(() => {
          c1.classList.remove("flipped");
          c1.innerText = "";
          c2.classList.remove("flipped");
          c2.innerText = "";
          flippedCards = [];
        }, 1000);
      }
    }
  }

  // Initialize defaults
  initTTT();
  initMemory();
</script>
{% endblock %}
