{% extends "layout.html" %} {% block title %}Plagiarism Checker{% endblock %} {%
block main %}
<div class="container py-5">
  <div class="row mb-5 text-center fade-in-up">
    <div class="col-lg-8 mx-auto">
      <h2 class="tool-header mb-3">
        <i class="bi bi-search me-2"></i>Plagiarism Checker
      </h2>
      <p class="text-muted">
        Check your text for uniqueness and duplicate content.
      </p>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8 fade-in-up" style="animation-delay: 0.1s">
      <form method="POST">
        <div class="glass-card p-4 p-md-5 mb-4">
          <div class="mb-4">
            <label class="form-label text-muted small fw-bold text-uppercase"
              >Your Text</label
            >
            <textarea
              name="text"
              rows="8"
              class="form-control bg-light-subtle border-0 rounded-4 shadow-inner"
              placeholder="Paste your text here to analyze..."
              required
            >
{{ text }}</textarea
            >
          </div>
          <button
            class="btn btn-neo w-100 btn-lg rounded-pill shadow-sm"
            type="submit"
          >
            <i class="bi bi-check2-all me-2"></i>Analyze Text
          </button>
        </div>
      </form>

      {% if result %}
      <div
        class="glass-card p-4 fade-in-up text-center display-result"
        style="animation-delay: 0.2s"
      >
        <div class="d-flex align-items-center justify-content-center mb-3">
          <div class="bg-info bg-opacity-10 text-info p-3 rounded-circle me-3">
            <i class="bi bi-info-lg fs-4"></i>
          </div>
          <div class="text-start">
            <h5 class="fw-bold mb-1">Analysis Result</h5>
            <p class="mb-0 text-muted small">{{ result }}</p>
          </div>
        </div>
        <!-- Future: detailed visual breakdown -->
      </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
