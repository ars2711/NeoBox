{% extends "layout.html" %} {% block title %}QR Code Tools{% endblock %} {%
block main %}
<div class="container py-5">
  <div class="row mb-5 text-center fade-in-up">
    <div class="col-lg-8 mx-auto">
      <h2 class="tool-header mb-3">
        <i class="bi bi-qr-code-scan me-2"></i>QR Code Tools
      </h2>
      <p class="text-muted">
        Generate custom QR codes or scan existing ones instantly.
      </p>
    </div>
  </div>

  <div class="row g-4">
    <!-- QR Generator -->
    <div class="col-lg-6 fade-in-up" style="animation-delay: 0.1s">
      <div class="glass-card h-100 p-4 p-md-5 d-flex flex-column">
        <h4 class="fw-bold mb-4 text-gradient">
          <i class="bi bi-pencil-square me-2"></i>Generator
        </h4>

        <form method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label small text-muted text-uppercase fw-bold"
              >Content</label
            >
            <input
              type="text"
              name="data"
              class="form-control bg-light-subtle border-0 rounded-4 py-3"
              placeholder="Enter text or URL..."
              required
            />
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label small text-muted text-uppercase fw-bold"
                >Color</label
              >
              <input
                type="color"
                name="color"
                value="#000000"
                class="form-control form-control-color w-100 border-0 rounded-3 shadow-sm"
                style="height: 48px"
              />
            </div>
            <div class="col-6">
              <label class="form-label small text-muted text-uppercase fw-bold"
                >Background</label
              >
              <input
                type="color"
                name="bgcolor"
                value="#ffffff"
                class="form-control form-control-color w-100 border-0 rounded-3 shadow-sm"
                style="height: 48px"
              />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small text-muted text-uppercase fw-bold"
              >Logo (Preview)</label
            >
            <input
              type="file"
              name="logo"
              accept="image/*"
              class="form-control bg-light-subtle border-0 rounded-3"
            />
          </div>

          <div class="mb-4">
            <label class="form-label small text-muted text-uppercase fw-bold"
              >Error Correction</label
            >
            <select
              name="error"
              class="form-select bg-light-subtle border-0 rounded-3"
            >
              <option value="L">Low</option>
              <option value="M">Medium</option>
              <option value="Q">Quartile</option>
              <option value="H">High</option>
            </select>
          </div>

          <button class="btn btn-neo w-100 rounded-pill mb-4" type="submit">
            <i class="bi bi-gear-wide-connected me-2"></i>Generate QR
          </button>
        </form>

        {% if img_data %}
        <div
          class="text-center mt-4 p-4 bg-white rounded-4 shadow-sm align-self-center"
        >
          <img
            src="data:image/png;base64,{{ img_data }}"
            class="img-fluid rounded mb-3"
            alt="QR Code"
            style="max-height: 200px"
          />
          <br />
          <a
            href="data:image/png;base64,{{ img_data }}"
            download="qrcode.png"
            class="btn btn-sm btn-outline-success rounded-pill px-3"
          >
            <i class="bi bi-download me-2"></i>Download
          </a>
        </div>
        {% endif %}
      </div>
    </div>

    <!-- QR Reader -->
    <div class="col-lg-6 fade-in-up" style="animation-delay: 0.2s">
      <div class="glass-card h-100 p-4 p-md-5 d-flex flex-column">
        <h4 class="fw-bold mb-4 text-gradient">
          <i class="bi bi-camera me-2"></i>Scanner
        </h4>

        <div
          class="flex-grow-1 d-flex flex-column align-items-center justify-content-center"
        >
          <div class="w-100 mb-3">
            <label class="form-label small text-muted text-uppercase fw-bold"
              >Upload Image</label
            >
            <input
              type="file"
              id="qrInput"
              accept="image/*"
              class="form-control bg-light-subtle border-0 rounded-3"
            />
          </div>

          <div
            id="qrVideo"
            class="w-100 rounded-4 overflow-hidden shadow-sm bg-black mb-3"
            style="min-height: 300px; display: none"
          ></div>
          <div
            id="qrResult"
            class="text-success fw-bold text-break text-center p-3 rounded-3 bg-success bg-opacity-10 w-100 d-none"
          ></div>
        </div>

        <button
          class="btn btn-outline-primary w-100 rounded-pill mt-3"
          id="startCam"
        >
          <i class="bi bi-power me-2"></i>Activate Camera
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
  // Camera scan logic
  document.getElementById("startCam").onclick = function () {
    let qrVideo = document.getElementById("qrVideo");
    qrVideo.style.display = "block";

    const html5QrCode = new Html5Qrcode("qrVideo");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode
      .start(
        { facingMode: "environment" },
        config,
        (decodedText, decodedResult) => {
          // Success
          document.getElementById("qrResult").style.display = "block";
          document.getElementById("qrResult").textContent =
            "Found: " + decodedText;
          html5QrCode.stop().then(() => {
            qrVideo.style.display = "none";
          });
        },
        (errorMessage) => {
          // Parse error
        },
      )
      .catch((err) => {
        console.log(err);
      });
  };

  // File scan logic (using html5-qrcode's file scan if desired, or simplified)
  document.getElementById("qrInput").addEventListener("change", (e) => {
    if (e.target.files.length == 0) return;
    const imageFile = e.target.files[0];

    const html5QrCode = new Html5Qrcode("qrVideo"); // reuse container logic? Or just api
    html5QrCode
      .scanFile(imageFile, true)
      .then((decodedText) => {
        document.getElementById("qrResult").style.display = "block";
        document.getElementById("qrResult").textContent =
          "File Decoded: " + decodedText;
      })
      .catch((err) => {
        document.getElementById("qrResult").style.display = "block";
        document.getElementById("qrResult").textContent = "Error: " + err;
        document.getElementById("qrResult").className =
          "alert alert-danger mt-2";
      });
  });
</script>
{% endblock %}
