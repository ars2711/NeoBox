{% extends "layout.html" %} {% block title %}Coin Toss{% endblock %} {% block
main %}
<div class="container py-5 text-center">
  <div class="glass-card mx-auto p-5 fade-in-up" style="max-width: 500px">
    <h2 class="tool-header mb-4"><i class="bi bi-coin me-2"></i>Coin Toss</h2>

    <div
      class="scene mx-auto mb-5"
      style="width: 150px; height: 150px; perspective: 600px"
    >
      <div
        id="coin-obj"
        class="coin"
        style="
          width: 100%;
          height: 100%;
          position: relative;
          transform-style: preserve-3d;
        "
      >
        <div class="coin-face coin-front">
          <span class="fs-4 fw-bold text-white">HEADS</span>
        </div>
        <div class="coin-face coin-back">
          <span class="fs-4 fw-bold text-white">TAILS</span>
        </div>
      </div>
    </div>

    <div class="mb-4">
      <h3
        id="result-text"
        class="fw-bold text-gradient opacity-0 transition-opacity"
      >
        {% if result %}{{ result }}{% else %}Ready?{% endif %}
      </h3>
    </div>

    <form method="POST" id="tossForm">
      <button class="btn btn-neo btn-lg px-5 rounded-pill" type="submit">
        Flip Coin <i class="bi bi-arrow-repeat ms-2"></i>
      </button>
    </form>
  </div>
</div>

<style>
  .scene {
    display: inline-block;
  }

  .coin {
    transition: transform 3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .coin-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      inset 0 0 20px rgba(189, 140, 36, 0.5),
      0 10px 20px rgba(0, 0, 0, 0.2);
    border: 4px solid #f6c85c;
  }

  .coin-front {
    background: radial-gradient(circle at 30% 30%, #ffdf6f, #b8860b);
    transform: rotateY(0deg);
  }

  .coin-back {
    background: radial-gradient(
      circle at 30% 30%,
      #e6e6fa,
      #708090
    ); /* Silver-ish for Tails to differentiate */
    background: radial-gradient(
      circle at 30% 30%,
      #ffdf6f,
      #b8860b
    ); /* Sticking to Gold for now */
    transform: rotateY(180deg);
  }

  /* Animation classes */
  .show-heads {
    transform: rotateY(1800deg);
  } /* 5 spins (360 * 5) + 0 */
  .show-tails {
    transform: rotateY(1980deg);
  } /* 5 spins (360 * 5) + 180 */
</style>

<script>
  {% if result %}
      document.addEventListener('DOMContentLoaded', () => {
          const coin = document.getElementById('coin-obj');
          const resultText = document.getElementById('result-text');

          // Brief delay to allow rendering before animation
          setTimeout(() => {
              // "Pre-spin" reset handled by css transition usually, but here we just add the class
              const isHeads = "{{ result }}".toLowerCase().includes('heads');

              if (isHeads) {
                  coin.classList.add('show-heads');
              } else {
                  coin.classList.add('show-tails');
              }

              // Reveal text after animation matches duration (3s)
              setTimeout(() => {
                  resultText.style.opacity = '1';
                  resultText.classList.add('animate__animated', 'animate__bounceIn');
              }, 3000);
          }, 100);
      });
  {% endif %}

      // Enhance form submit to look smoother
      document.getElementById('tossForm').addEventListener('submit', function() {
          // Reset rotation visually before submit (won't be seen much due to reload, but helps mental model)
      });
</script>
{% endblock %}
