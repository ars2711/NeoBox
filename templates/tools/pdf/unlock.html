{% extends "layout.html" %} {% block title %}Unlock PDF{% endblock %} {% block
content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="glass-card fade-in p-5 text-center">
      <h2 class="mb-4 display-6">
        <i class="bi bi-unlock-fill text-danger me-2"></i>Unlock PDF
      </h2>
      <p class="text-muted mb-5">
        Remove password security from PDF (requires current password).
      </p>

      <form
        action="{{ url_for('pdf_tools') }}"
        method="post"
        enctype="multipart/form-data"
      >
        <input type="hidden" name="action" value="remove_password" />

        <div class="mb-4">
          <label
            class="form-label d-block p-4 border border-2 border-dashed rounded-4 bg-light bg-opacity-50 cursor-pointer hover-effect"
          >
            <i class="bi bi-cloud-upload display-4 text-secondary mb-3"></i>
            <h5 class="fw-bold text-muted">Select PDF</h5>
            <input
              type="file"
              name="file"
              class="d-none"
              accept=".pdf"
              multiple
              required
              onchange="updateCount(this)"
            />
            <p id="fileCount" class="small text-primary mt-2"></p>
          </label>
        </div>

        <div class="mb-4 text-start">
          <label class="form-label">Current Password</label>
          <input
            type="password"
            name="password"
            class="form-control form-control-lg"
            required
            placeholder="Enter current password"
          />
        </div>

        <div class="d-grid">
          <button
            type="submit"
            class="btn btn-danger btn-lg rounded-pill shadow-sm"
          >
            <i class="bi bi-unlock me-2"></i>Unlock PDF
          </button>
        </div>
      </form>

      {% if error %}
      <div class="alert alert-danger mt-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
      </div>
      {% endif %} {% if result %}
      <div
        class="mt-5 p-4 bg-success bg-opacity-10 rounded-4 border border-success"
      >
        <h4 class="text-success mb-3">
          <i class="bi bi-check-circle-fill me-2"></i>Success!
        </h4>

        <a
          href="{{ result }}"
          class="btn btn-success btn-lg rounded-pill px-5 shadow-sm"
          download
        >
          <i class="bi bi-download me-2"></i>Download File
        </a>
      </div>
      {% endif %}
    </div>
  </div>
</div>
<script>
  function updateCount(input) {
    document.getElementById("fileCount").innerText =
      input.files.length + " file(s) selected";
  }
</script>
{% endblock %}
