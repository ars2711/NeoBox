{% extends "layout.html" %} {% block title %}Password Generator{% endblock %} {%
block main %}
<div class="container py-5">
  <div class="row mb-5 text-center fade-in-up">
    <div class="col-lg-8 mx-auto">
      <h2 class="tool-header mb-3">
        <i class="bi bi-key-fill me-2"></i>Password Generator
      </h2>
      <p class="text-muted">Create strong, secure passwords instantly.</p>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-6 fade-in-up" style="animation-delay: 0.1s">
      <div class="glass-card p-4 p-md-5">
        <form method="post">
          <div class="mb-4">
            <label
              class="form-label text-muted small fw-bold text-uppercase d-flex justify-content-between"
            >
              <span>Length</span>
              <span class="badge bg-primary rounded-pill" id="lenVal"
                >{{ length or 12 }}</span
              >
            </label>
            <input
              type="range"
              class="form-range"
              name="length"
              min="6"
              max="64"
              value="{{ length or 12 }}"
              oninput="document.getElementById('lenVal').innerText = this.value"
            />
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-12">
              <div class="p-3 bg-light-subtle rounded-4">
                <div class="form-check form-switch mb-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    name="uppercase"
                    id="uppercase"
                    {%
                    if
                    uppercase
                    %}checked{%
                    endif
                    %}
                  />
                  <label class="form-check-label" for="uppercase"
                    >{{ _('Include Uppercase (A-Z)') }}</label
                  >
                </div>
                <div class="form-check form-switch mb-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    name="numbers"
                    id="numbers"
                    {%
                    if
                    numbers
                    %}checked{%
                    endif
                    %}
                  />
                  <label class="form-check-label" for="numbers"
                    >{{ _('Include Numbers (0-9)') }}</label
                  >
                </div>
                <div class="form-check form-switch">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    name="symbols"
                    id="symbols"
                    {%
                    if
                    symbols
                    %}checked{%
                    endif
                    %}
                  />
                  <label class="form-check-label" for="symbols"
                    >{{ _('Include Symbols (!@#)') }}</label
                  >
                </div>
              </div>
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-neo w-100 py-3 rounded-pill shadow-sm"
          >
            <i class="bi bi-gear-wide-connected me-2"></i>Generate Password
          </button>
        </form>
      </div>

      {% if password %}
      <div
        class="glass-card mt-4 p-4 text-center fade-in-up"
        style="animation-delay: 0.2s"
      >
        <label class="form-label text-muted small fw-bold text-uppercase mb-3"
          >Your Safe Password</label
        >
        <div
          class="d-flex align-items-center justify-content-center bg-white p-3 rounded-4 border shadow-inner mb-3"
        >
          <span
            class="fs-4 font-monospace text-break fw-bold text-dark"
            id="generatedPwd"
            >{{ password }}</span
          >
        </div>

        <div class="d-flex justify-content-center gap-2">
          <button class="btn btn-light rounded-pill px-4" onclick="copyPwd()">
            <i class="bi bi-clipboard me-2"></i>Copy
          </button>
          <a
            href="/tools/password_manager"
            class="btn btn-outline-primary rounded-pill px-4"
          >
            <i class="bi bi-save me-2"></i>Save to Vault
          </a>
        </div>
        <div
          id="copyMsg"
          class="small text-success mt-2 opacity-0 transition-opacity"
        >
          Copied!
        </div>
      </div>
      {% endif %}
    </div>
  </div>
</div>

<script>
  function copyPwd() {
    const pwd = document.getElementById("generatedPwd").innerText;
    navigator.clipboard.writeText(pwd);
    const msg = document.getElementById("copyMsg");
    msg.classList.remove("opacity-0");
    setTimeout(() => msg.classList.add("opacity-0"), 2000);
  }
</script>
<style>
  .transition-opacity {
    transition: opacity 0.3s;
  }
</style>
{% endblock %}
