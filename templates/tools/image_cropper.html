{% extends "layout.html" %} {% block title %}Image Cropper{% endblock %} {%
block content %}
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"
/>

<div class="container py-5">
  <div class="row mb-5 text-center fade-in-up">
    <div class="col-lg-8 mx-auto">
      <h2 class="tool-header mb-3">
        <i class="bi bi-crop me-2"></i>Image Cropper
      </h2>
      <p class="text-muted">
        Crop, rotate, and resize your images with precision.
      </p>
    </div>
  </div>

  <div class="row g-4">
    <!-- Editor Area -->
    <div class="col-lg-9 fade-in-up" style="animation-delay: 0.1s">
      <div
        class="glass-card p-0 overflow-hidden shadow-sm"
        style="min-height: 600px"
      >
        <div
          class="d-flex align-items-center justify-content-center bg-dark bg-opacity-75 p-0"
          style="height: 600px; position: relative"
        >
          <img id="image" style="max-width: 100%; display: none" />

          <div id="uploadPrompt" class="text-center p-5 text-white">
            <div class="mb-4">
              <i class="bi bi-image display-1 opacity-50"></i>
            </div>
            <h4 class="fw-bold mb-3">Upload an Image to Begin</h4>
            <p class="opacity-75 mb-4">Drag and drop or select a file</p>
            <input type="file" id="fileInput" accept="image/*" class="d-none" />
            <button
              class="btn btn-neo rounded-pill px-5"
              onclick="document.getElementById('fileInput').click()"
            >
              <i class="bi bi-upload me-2"></i>Choose Image
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls Sidebar -->
    <div class="col-lg-3 fade-in-up" style="animation-delay: 0.2s">
      <div class="glass-card p-3 h-100">
        <h6 class="fw-bold text-uppercase text-muted small mb-3">Tools</h6>

        <div class="d-grid gap-2 mb-4">
          <div class="btn-group shadow-sm">
            <button
              class="btn btn-light border"
              onclick="cropper.setDragMode('move')"
              title="Move Canvas"
              data-bs-toggle="tooltip"
            >
              <i class="bi bi-arrows-move"></i>
            </button>
            <button
              class="btn btn-light border"
              onclick="cropper.setDragMode('crop')"
              title="Crop Selection"
              data-bs-toggle="tooltip"
            >
              <i class="bi bi-crop"></i>
            </button>
          </div>

          <div class="btn-group shadow-sm">
            <button
              class="btn btn-light border"
              onclick="cropper.zoom(0.1)"
              title="Zoom In"
            >
              <i class="bi bi-zoom-in"></i>
            </button>
            <button
              class="btn btn-light border"
              onclick="cropper.zoom(-0.1)"
              title="Zoom Out"
            >
              <i class="bi bi-zoom-out"></i>
            </button>
          </div>

          <div class="btn-group shadow-sm">
            <button
              class="btn btn-light border"
              onclick="cropper.rotate(-45)"
              title="Rotate Left"
            >
              <i class="bi bi-arrow-counterclockwise"></i>
            </button>
            <button
              class="btn btn-light border"
              onclick="cropper.rotate(45)"
              title="Rotate Right"
            >
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>

          <button
            class="btn btn-sm btn-outline-secondary"
            onclick="cropper.reset()"
          >
            Reset All
          </button>
        </div>

        <hr class="opacity-10" />

        <h6 class="fw-bold text-uppercase text-muted small mb-3">
          Aspect Ratio
        </h6>
        <div class="d-grid gap-2 mb-4">
          <div class="btn-group" role="group">
            <button
              class="btn btn-outline-primary btn-sm"
              onclick="cropper.setAspectRatio(16 / 9)"
            >
              16:9
            </button>
            <button
              class="btn btn-outline-primary btn-sm"
              onclick="cropper.setAspectRatio(4 / 3)"
            >
              4:3
            </button>
          </div>
          <div class="btn-group" role="group">
            <button
              class="btn btn-outline-primary btn-sm"
              onclick="cropper.setAspectRatio(1)"
            >
              1:1
            </button>
            <button
              class="btn btn-outline-primary btn-sm"
              onclick="cropper.setAspectRatio(NaN)"
            >
              Free
            </button>
          </div>
        </div>

        <hr class="opacity-10" />

        <div class="d-grid gap-2">
          <button
            class="btn btn-neo py-2 shadow-sm"
            onclick="cropAndDownload()"
          >
            <i class="bi bi-download me-2"></i>Download
          </button>
          <button
            class="btn btn-light text-danger border-0"
            onclick="location.reload()"
          >
            <i class="bi bi-trash me-2"></i>Clear
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script>
  const fileInput = document.getElementById("fileInput");
  const image = document.getElementById("image");
  const uploadPrompt = document.getElementById("uploadPrompt");
  let cropper;

  fileInput.addEventListener("change", (e) => {
    if (e.target.files && e.target.files[0]) {
      const reader = new FileReader();
      reader.onload = (event) => {
        image.src = event.target.result;
        image.style.display = "block";
        uploadPrompt.style.display = "none";

        if (cropper) cropper.destroy();

        cropper = new Cropper(image, {
          viewMode: 1,
          dragMode: "move",
          autoCropArea: 1,
          restore: false,
          guides: true,
          center: true,
          highlight: false,
          cropBoxMovable: true,
          cropBoxResizable: true,
          toggleDragModeOnDblclick: false,
        });
      };
      reader.readAsDataURL(e.target.files[0]);
    }
  });

  window.cropAndDownload = () => {
    if (!cropper) return;
    cropper.getCroppedCanvas().toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cropped.png";
      a.click();
    });
  };
</script>
{% endblock %}
