{% extends "layout.html" %} 
{% block title %}{{ _('Creative Canvas') }}{% endblock %} 
{% block main %}
<div class="container py-5">
  <div class="text-center mb-4 fade-in-up">
      <h1 class="display-4 fw-bold mb-2 tool-header">Creative Canvas</h1>
      <p class="text-muted">Unleash your imagination. Sketch, draw, and save.</p>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="glass-card p-4 fade-in-up" style="animation-delay: 0.1s;">
        
        <!-- Toolbar -->
        <div class="d-flex flex-wrap gap-3 mb-3 align-items-center justify-content-center p-3 bg-light rounded-pill shadow-sm">
           <!-- Color -->
           <div class="d-flex align-items-center gap-2">
               <input
                type="color"
                id="color"
                value="#000000"
                class="form-control form-control-color border-0 shadow-none p-0"
                style="width: 40px; height: 40px; border-radius: 50%; cursor: pointer;"
                title="{{ _('Brush Color') }}"
              />
           </div>
           
           <div class="vr mx-2"></div>

           <!-- Size -->
           <div class="d-flex align-items-center gap-2">
               <i class="bi bi-circle-fill small" style="font-size: 0.5rem;"></i>
               <input
                type="range"
                id="size"
                min="1"
                max="50"
                value="5"
                class="form-range"
                style="width: 100px"
              />
              <i class="bi bi-circle-fill" style="font-size: 1.2rem;"></i>
           </div>

           <div class="vr mx-2"></div>

           <!-- Tools -->
           <div class="btn-group">
               <button class="btn btn-outline-secondary active" id="btnBrush" onclick="setTool('brush')">
                   <i class="bi bi-brush"></i>
               </button>
               <button class="btn btn-outline-secondary" id="btnEraser" onclick="setTool('eraser')">
                   <i class="bi bi-eraser"></i>
               </button>
           </div>

           <div class="vr mx-2"></div>

           <!-- Actions -->
           <button class="btn btn-outline-danger rounded-circle" onclick="clearCanvas()" title="{{ _('Clear') }}">
             <i class="bi bi-trash"></i>
           </button>
           <button class="btn btn-primary rounded-pill px-4" onclick="downloadCanvas()">
             <i class="bi bi-download me-2"></i> {{ _('Save Art') }}
           </button>
        </div>

        <!-- Canvas Container -->
        <div class="canvas-container bg-white rounded-3 shadow-inner position-relative overflow-hidden" 
             style="border: 2px dashed #ddd; cursor: crosshair;">
            <canvas
              id="drawCanvas"
              width="900"
              height="500"
              class="d-block w-100"
            ></canvas>
            
            <div id="startPrompt" class="position-absolute top-50 start-50 translate-middle text-muted opacity-25 pointer-events-none">
                <i class="bi bi-pencil-fill display-1"></i>
                <p class="mt-2 text-center fw-bold">Start Drawing</p>
            </div>
        </div>
        
        <div class="text-center mt-3 text-muted small">
            <i class="bi bi-info-circle me-1"></i> Works best on touch screens or with a mouse.
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById("drawCanvas");
  const ctx = canvas.getContext("2d");
  const startPrompt = document.getElementById("startPrompt");
  
  // Resize canvas to parent width
  function resizeCanvas() {
      const parent = canvas.parentElement;
      canvas.width = parent.clientWidth;
      canvas.height = 500; // Fixed height
      
      // Restore styles
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
  }
  
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas(); // Init

  let drawing = false;
  let tool = 'brush';
  let colorInput = document.getElementById("color");
  let sizeInput = document.getElementById("size");
  let lastX = 0;
  let lastY = 0;

  function setTool(t) {
      tool = t;
      document.getElementById('btnBrush').classList.toggle('active', t === 'brush');
      document.getElementById('btnEraser').classList.toggle('active', t === 'eraser');
  }

  function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || e.touches[0].clientX;
      const clientY = e.clientY || e.touches[0].clientY;
      return {
          x: clientX - rect.left,
          y: clientY - rect.top
      };
  }

  function startDraw(e) {
      drawing = true;
      const pos = getPos(e);
      lastX = pos.x;
      lastY = pos.y;
      if(startPrompt) startPrompt.style.display = 'none';
      // Prevent default to stop some touch scrolling actions
      if (e.type !== 'mousedown') e.preventDefault(); 
  }

  function draw(e) {
      if (!drawing) return;
      // Prevent default to stop scrolling
      e.preventDefault(); 
      
      const pos = getPos(e);
      
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(pos.x, pos.y);
      
      ctx.lineWidth = sizeInput.value;
      if (tool === 'eraser') {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.strokeStyle = 'rgba(0,0,0,1)'; 
      } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = colorInput.value;
      }
      
      ctx.stroke();
      
      lastX = pos.x;
      lastY = pos.y;
  }

  function stopDraw() {
      drawing = false;
      ctx.beginPath(); 
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseout', stopDraw);
  
  // Touch support
  canvas.addEventListener('touchstart', startDraw, {passive: false});
  canvas.addEventListener('touchmove', draw, {passive: false});
  canvas.addEventListener('touchend', stopDraw);

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(startPrompt) startPrompt.style.display = 'block';
  }

  function downloadCanvas() {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const tCtx = tempCanvas.getContext('2d');
    
    tCtx.fillStyle = "#ffffff";
    tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
    tCtx.drawImage(canvas, 0, 0);
    
    const link = document.createElement("a");
    link.download = "neobox-art-" + Date.now() + ".png";
    link.href = tempCanvas.toDataURL();
    link.click();
  }
</script>
{% endblock %}
