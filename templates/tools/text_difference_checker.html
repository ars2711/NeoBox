{% extends "layout.html" %} {% block title %}Text Difference Checker{% endblock %}
{% block main %}
<div class="container py-5">
    <div class="row mb-5 text-center fade-in-up">
        <div class="col-lg-8 mx-auto">
             <h2 class="tool-header mb-3"><i class="bi bi-file-diff me-2"></i>Diff Checker</h2>
             <p class="text-muted">Compare two text files and highlight the differences.</p>
        </div>
    </div>

  <div class="row justify-content-center">
    <div class="col-lg-12 fade-in-up" style="animation-delay: 0.1s;">
      <div class="glass-card p-4">
        <form method="POST">
             <div class="row g-3">
                 <div class="col-md-6">
                     <label class="form-label fw-bold">Original Text</label>
                     <textarea name="a" class="form-control bg-light shadow-inner border-0 font-monospace" rows="10" placeholder="Paste original text...">{{ a }}</textarea>
                 </div>
                 <div class="col-md-6">
                     <label class="form-label fw-bold">Modified Text</label>
                     <textarea name="b" class="form-control bg-light shadow-inner border-0 font-monospace" rows="10" placeholder="Paste modified text...">{{ b }}</textarea>
                 </div>
             </div>
             <div class="text-center mt-4">
                 <button type="submit" class="btn btn-neo px-5">Compare Difference</button>
             </div>
        </form>

        {% if diff %}
        <div class="mt-5 animate__animated animate__fadeIn">
            <h5 class="fw-bold mb-3">Comparison Result</h5>
            <div class="bg-white p-0 rounded-3 shadow-inner border overflow-hidden">
                <div class="p-3 bg-light border-bottom small text-muted"> <i class="bi bi-info-circle me-1"></i> Output generated by Python DiffLib</div>
                <div class="p-3" style="overflow-x: auto;">
                    <pre class="mb-0">{{ diff }}</pre>
                </div>
            </div>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
{% endblock %}
