{% extends "layout.html" %} 
{% block title %}{{ _('Daily Questions') }}{% endblock %} 
{% block main %}
<div class="container py-5">
  <div class="row text-center mb-5 fade-in-up">
      <div class="col-lg-8 mx-auto">
        <h2 class="tool-header mb-3">{{ _('Daily Questions') }}</h2>
        <p class="text-muted">Questions to spark conversation, introspection, and journaling.</p>
      </div>
  </div>

  <div class="row row-cols-1 row-cols-md-2 g-4">
      {% for question in questions %}
      <div class="col fade-in-up" style="animation-delay: {{ loop.index0 * 0.1 }}s;">
          <div class="glass-card h-100 p-4 position-relative hover-lift">
              <div class="position-absolute top-0 end-0 p-3 opacity-25">
                  <i class="bi bi-patch-question-fill fs-1 text-primary"></i>
              </div>
              <div class="d-flex align-items-start">
                  <span class="fs-1 text-muted opacity-25 me-3 fw-bold font-monospace">Q{{ loop.index }}</span>
                  <div class="pt-2">
                       <h5 class="fw-bold mb-3">{{ question }}</h5>
                       <div class="mt-3">
                           <button class="btn btn-sm btn-outline-light rounded-pill text-dark border-secondary border-opacity-25" 
                                   onclick="copyText(this, '{{ question|replace("'", "\\'") }}')">
                               <i class="bi bi-clipboard me-1"></i> Copy
                           </button>
                           <button class="btn btn-sm btn-outline-light rounded-pill text-dark border-secondary border-opacity-25"
                                   onclick="shareText('{{ question|replace("'", "\\'") }}')">
                               <i class="bi bi-share me-1"></i> Share
                           </button>
                       </div>
                  </div>
              </div>
          </div>
      </div>
      {% endfor %}
  </div>
</div>

<script>
    function copyText(btn, text) {
        navigator.clipboard.writeText(text);
        const icon = btn.querySelector('i');
        icon.className = 'bi bi-check2';
        btn.classList.add('text-success');
        setTimeout(() => {
            icon.className = 'bi bi-clipboard';
            btn.classList.remove('text-success');
        }, 2000);
    }

    function shareText(text) {
        if (navigator.share) {
            navigator.share({
                title: 'Daily Question',
                text: text,
            });
        } else {
            alert('Sharing is not supported on this device.');
        }
    }
</script>

<style>
    .hover-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .hover-lift:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        border-color: rgba(var(--neo-accent-rgb), 0.5);
    }
</style>
{% endblock %}
