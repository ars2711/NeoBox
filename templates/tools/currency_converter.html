{% extends "/layout.html" %} {% block title %}Currency Converter{% endblock %}
{% block main %}
<div class="container py-5">
  <div class="row align-items-center mb-5 fade-in-up">
    <div class="col-md-12 text-center">
      <h2 class="tool-header mb-2">{{ _('Currency Converter') }}</h2>
      <p class="text-muted">
        Real-time exchange rates with historical accuracy.
      </p>
    </div>
  </div>

  <div
    class="row justify-content-center fade-in-up"
    style="animation-delay: 0.1s"
  >
    <div class="col-md-8 col-lg-6">
      <div class="glass-card p-4 p-md-5">
        <form method="post" class="mb-3" id="currencyForm">
          <div class="mb-4">
            <label
              class="form-label text-muted small fw-bold text-uppercase ps-1"
              >Amount</label
            >
            <div class="input-group input-group-lg">
              <span
                class="input-group-text bg-transparent border-end-0 text-muted"
                ><i class="bi bi-cash-stack"></i
              ></span>
              <input
                type="number"
                step="any"
                name="amount"
                class="form-control bg-light-subtle border-start-0"
                placeholder="0.00"
                required
                value="{{ amount or '' }}"
              />
            </div>
          </div>

          <div class="row g-3 align-items-center mb-4 position-relative">
            <div class="col-12 col-md-5">
              <label
                class="form-label text-muted small fw-bold text-uppercase ps-1"
                >From</label
              >
              <div class="select-wrapper">
                <select
                  name="from_currency"
                  id="from_currency"
                  class="form-select form-select-lg"
                  required
                >
                  {% for code, name in currencies %}
                  <option
                    value="{{ code }}"
                    {%
                    if
                    from_currency=""
                    ="code"
                    %}selected{%
                    endif
                    %}
                  >
                    {{ code }} - {{ name }}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="col-12 col-md-2 text-center">
              <button
                type="button"
                class="btn btn-outline-secondary rounded-circle shadow-sm swap-btn"
                onclick="swapCurrencies()"
                style="width: 50px; height: 50px"
              >
                <i class="bi bi-arrow-left-right"></i>
              </button>
            </div>

            <div class="col-12 col-md-5">
              <label
                class="form-label text-muted small fw-bold text-uppercase ps-1"
                >To</label
              >
              <div class="select-wrapper">
                <select
                  name="to_currency"
                  id="to_currency"
                  class="form-select form-select-lg"
                  required
                >
                  {% for code, name in currencies %}
                  <option
                    value="{{ code }}"
                    {%
                    if
                    to_currency=""
                    ="code"
                    %}selected{%
                    endif
                    %}
                  >
                    {{ code }} - {{ name }}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </div>

          <button
            class="btn btn-neo w-100 py-3 rounded-pill fw-bold"
            type="submit"
          >
            <i class="bi bi-arrow-repeat me-2"></i>Convert Currency
          </button>
        </form>

        {% if result is not none %}
        <div
          class="text-center mt-4 pt-4 border-top border-secondary border-opacity-10 animate__animated animate__fadeIn"
        >
          <div class="text-muted small text-uppercase mb-2">Exchange Rate</div>
          <h3 class="display-6 fw-bold text-gradient mb-0">{{ result }}</h3>
          <small class="text-muted d-block mt-2">
            <i class="bi bi-clock-history me-1"></i> Updated just now
          </small>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>

<style>
  .select2-container .select2-selection--single {
    height: 48px !important;
    background-color: rgba(255, 255, 255, 0.5) !important;
    border: 1px solid #dee2e6 !important;
    border-radius: 0.5rem !important;
    display: flex !important;
    align-items: center !important;
  }

  .select2-container--default
    .select2-selection--single
    .select2-selection__arrow {
    height: 48px !important;
  }

  .swap-btn {
    background: white;
    transition: transform 0.3s ease;
  }

  .swap-btn:hover {
    transform: rotate(180deg);
    background: var(--neo-accent);
    color: white;
    border-color: var(--neo-accent);
  }

  @media (max-width: 768px) {
    .swap-btn {
      transform: rotate(90deg);
      margin: 10px 0;
    }
    .swap-btn:hover {
      transform: rotate(270deg);
    }
  }
</style>

<link
  href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
  rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    $("#from_currency").select2({ width: "100%" });
    $("#to_currency").select2({ width: "100%" });
  });

  function swapCurrencies() {
    const fromSelect = $("#from_currency");
    const toSelect = $("#to_currency");

    const fromVal = fromSelect.val();
    const toVal = toSelect.val();

    fromSelect.val(toVal).trigger("change");
    toSelect.val(fromVal).trigger("change");
  }
</script>
{% endblock %}
