{% extends "layout.html" %} {% block title %}Text Reverser{% endblock %}
{% block main %}
<div class="container py-5">
    <div class="row mb-5 text-center fade-in-up">
        <div class="col-lg-8 mx-auto">
             <h2 class="tool-header mb-3"><i class="bi bi-arrow-repeat me-2"></i>Text Reverser</h2>
             <p class="text-muted">Instantly reverse text, words, or letters.</p>
        </div>
    </div>

  <div class="row justify-content-center">
    <div class="col-lg-8 fade-in-up" style="animation-delay: 0.1s;">
      <div class="glass-card p-4 p-md-5">
        <form method="post">
            <div class="mb-4">
                <textarea
                  name="text"
                  class="form-control form-control-lg border-0 bg-light shadow-inner p-4"
                  rows="6"
                  placeholder="Enter text to reverse..."
                  required
                >{{ text if text else '' }}</textarea>
            </div>
            
            <div class="text-center">
                <button type="submit" class="btn btn-neo px-5 rounded-pill">
                    <i class="bi bi-arrow-left-right me-2"></i> Reverse Text
                </button>
            </div>
        </form>

        {% if result %}
        <div class="mt-5 animate__animated animate__fadeIn">
            <label class="form-label fw-bold text-muted small text-uppercase">Reversed Output</label>
            <div class="position-relative">
                <div class="bg-white p-4 rounded-3 shadow-inner border text-break font-monospace" id="resultBox">{{ result }}</div>
                <button class="btn btn-sm btn-light position-absolute top-0 end-0 m-2 shadow-sm" onclick="navigator.clipboard.writeText(document.getElementById('resultBox').innerText)">Copy</button>
            </div>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
{% endblock %}
