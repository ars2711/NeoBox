{% extends "layout.html" %} {% block title %}Text to Speech{% endblock %}
{% block main %}
<div class="container py-5">
    <div class="row mb-5 text-center fade-in-up">
        <div class="col-lg-8 mx-auto">
             <h2 class="tool-header mb-3"><i class="bi bi-megaphone me-2"></i>Text to Speech</h2>
             <p class="text-muted">Convert written text into spoken words with different accents and genders.</p>
        </div>
    </div>

  <div class="row justify-content-center">
    <div class="col-lg-8 fade-in-up" style="animation-delay: 0.1s;">
      <div class="glass-card p-4 p-md-5">
        <form method="post">
            <div class="mb-4">
                <label class="form-label fw-bold small text-muted text-uppercase">Your Text</label>
                <textarea name="text" rows="5" class="form-control form-control-lg border-0 bg-light shadow-inner p-3" placeholder="Enter text here..." required>{{ text if text else '' }}</textarea>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">Language</label>
                    <select name="lang" class="form-select border-0 shadow-sm bg-white">
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="hi">Hindi</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>
                <!-- Note: 'Accent' and 'Gender' support depends on backend logic usually (e.g. gTTS or pyttsx3). 
                     Including them as per original template structure. -->
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">Accent/Region</label>
                    <select name="accent" class="form-select border-0 shadow-sm bg-white">
                        <option value="default">Default</option>
                        <option value="us">US</option>
                        <option value="uk">UK (GB)</option>
                        <option value="au">Australia</option>
                        <option value="in">India</option>
                        <option value="ca">Canada</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small fw-bold text-muted">Voice Type</label>
                    <select name="gender" class="form-select border-0 shadow-sm bg-white">
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </div>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-neo px-5 rounded-pill">
                    <i class="bi bi-volume-up-fill me-2"></i> Speak
                </button>
            </div>
        </form>
        
        {% if audio_file %}
        <div class="mt-4 p-3 bg-primary bg-opacity-10 rounded-3 border border-primary border-opacity-25 animate__animated animate__fadeIn">
             <div class="d-flex align-items-center justify-content-between">
                 <span class="fw-bold text-primary"><i class="bi bi-music-note-beamed me-2"></i>Audio Generated</span>
                 <audio controls autoplay class="w-50">
                     <source src="{{ audio_file }}" type="audio/mpeg">
                     Your browser does not support the audio element.
                 </audio>
             </div>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
{% endblock %}
