{% extends "layout.html" %} {% block title %}Random Name Picker{% endblock %} {%
block main %}
<div class="container py-5">
  <div class="row mb-5 text-center fade-in-up">
    <div class="col-lg-8 mx-auto">
      <h2 class="tool-header mb-3">
        <i class="bi bi-person-check me-2"></i>Random Name Picker
      </h2>
      <p class="text-muted">Pick a winner from a list of names.</p>
    </div>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-8 fade-in-up" style="animation-delay: 0.1s">
      <div class="glass-card p-4 p-md-5">
        <form method="POST">
          <div class="mb-4">
            <label class="form-label small text-muted text-uppercase fw-bold"
              >Names / Items (comma separated)</label
            >
            <textarea
              name="names"
              class="form-control bg-light-subtle border-0 rounded-4 shadow-inner"
              rows="6"
              placeholder="Alice, Bob, Charlie"
            >
{{ names }}</textarea
            >
          </div>

          <div class="text-center mb-4">
            <button
              type="submit"
              class="btn btn-neo btn-lg rounded-pill px-5 shadow-sm hover-scale"
            >
              <i class="bi bi-trophy me-2"></i>Pick Random Name
            </button>
          </div>
        </form>

        {% if result %}
        <div
          id="resultArea"
          class="text-center p-5 border border-2 border-dashed rounded-4 animate__animated animate__bounceIn"
        >
          <div class="text-muted small text-uppercase mb-2">The Winner Is</div>
          <h1 class="display-3 fw-bold text-gradient">{{ result }}</h1>
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</div>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
/>
{% endblock %}
