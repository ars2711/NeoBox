{% extends "layout.html" %} {% block title %}Star Map{% endblock %}
{% block main %}
<div class="container py-5">
    <div class="row mb-5 text-center fade-in-up">
        <div class="col-lg-8 mx-auto">
             <h2 class="tool-header mb-3"><i class="bi bi-stars me-2"></i>Interactive Star Map</h2>
             <p class="text-muted">Explore the constellations and celestial bodies in real-time.</p>
        </div>
    </div>

  <div class="row justify-content-center">
    <div class="col-lg-10 fade-in-up" style="animation-delay: 0.1s;">
      <div class="glass-card p-2 p-md-3">
        <!-- VirtualSky Container -->
        <div id="starmap" style="width: 100%; height: 600px; border-radius: 15px; overflow: hidden;" class="bg-dark shadow-inner"></div>
         <div class="text-center mt-3 small text-muted">
            <i class="bi bi-info-circle me-1"></i> Drag to rotate • Scroll to zoom • Click objects for info
         </div>
      </div>
    </div>
  </div>
</div>

<!-- VirtualSky Library -->
<script src="https://stuquery.com/stuquery.js"></script>
<script src="https://virtualsky.lco.global/embed/virtualsky.js"></script>

<script>
  // Initialize Planetarium
  let planetarium = S.virtualsky({
    id: "starmap",
    projection: "stereo",
    fov: 45, // Field of view
    latitude: 34.0522, // Default (LA), can ask for GeoLocation later
    longitude: -118.2437,
    lang: "en",
    showstarlabels: true,
    showplanetlabels: true,
    constellations: true,
    gridlines_az: true,
    live: true, // Live time
    az: 180, // Facing South
  });

  // Optional: Try to get user location
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        planetarium.latitude = pos.coords.latitude;
        planetarium.longitude = pos.coords.longitude;
      },
      (err) => console.log("Location denied or error")
    );
  }
</script>
{% endblock %}
