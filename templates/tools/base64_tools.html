{% extends "layout.html" %} {% block title %}Base64 Tools{% endblock %} {% block
content %}
<div class="container py-4">
  <div class="tool-header d-flex align-items-center mb-4">
    <div
      class="feature-icon-small d-inline-flex align-items-center justify-content-center bg-gradient text-white fs-4 rounded-3 me-3"
      style="width: 48px; height: 48px"
    >
      <i class="bi bi-braces"></i>
    </div>
    <div>
      <h1 class="h3 mb-0">Base64 Converter</h1>
      <p class="text-muted mb-0">Encode and decode text or files to Base64</p>
    </div>
  </div>

  <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
    <li class="nav-item" role="presentation">
      <button
        class="nav-link active"
        id="text-tab"
        data-bs-toggle="pill"
        data-bs-target="#pills-text"
        type="button"
        role="tab"
      >
        Text
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        id="image-tab"
        data-bs-toggle="pill"
        data-bs-target="#pills-image"
        type="button"
        role="tab"
      >
        Image/File
      </button>
    </li>
  </ul>

  <div class="tab-content" id="pills-tabContent">
    <!-- Text Tab -->
    <div class="tab-pane fade show active" id="pills-text" role="tabpanel">
      <div class="card glass-card">
        <div class="card-body">
          <div class="row">
            <div class="col-md-5">
              <label class="form-label">Input</label>
              <textarea
                id="textInput"
                class="form-control font-monospace"
                rows="10"
              ></textarea>
            </div>
            <div
              class="col-md-2 d-flex flex-column justify-content-center align-items-center gap-2 py-3"
            >
              <button class="btn btn-primary w-100" onclick="encodeText()">
                Encode <i class="bi bi-arrow-right"></i>
              </button>
              <button class="btn btn-primary w-100" onclick="decodeText()">
                <i class="bi bi-arrow-left"></i> Decode
              </button>
              <button
                class="btn btn-outline-secondary w-100"
                onclick="swapText()"
              >
                <i class="bi bi-arrow-left-right"></i> Swap
              </button>
              <button
                class="btn btn-outline-danger w-100"
                onclick="clearText()"
              >
                <i class="bi bi-x-lg"></i> Clear
              </button>
            </div>
            <div class="col-md-5">
              <label class="form-label">Output</label>
              <textarea
                id="textOutput"
                class="form-control font-monospace"
                rows="10"
                readonly
              ></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Image Tab -->
    <div class="tab-pane fade" id="pills-image" role="tabpanel">
      <div class="card glass-card">
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Upload Image or File</label>
            <input
              type="file"
              id="fileInput"
              class="form-control"
              onchange="convertFile()"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Base64 Output</label>
            <div class="input-group">
              <textarea
                id="fileOutput"
                class="form-control font-monospace"
                rows="8"
                readonly
              ></textarea>
              <button
                class="btn btn-outline-secondary"
                onclick="copyFileOutput()"
              >
                <i class="bi bi-clipboard"></i>
              </button>
            </div>
          </div>
          <div id="previewArea" class="mt-3 text-center d-none">
            <h6>Preview:</h6>
            <img
              id="imgPreview"
              src=""
              class="img-fluid border rounded"
              style="max-height: 300px"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function encodeText() {
    const input = document.getElementById("textInput").value;
    try {
      document.getElementById("textOutput").value = btoa(input);
    } catch (e) {
      alert("Encoding failed. Ensure input is valid text.");
    }
  }

  function decodeText() {
    const input = document.getElementById("textInput").value;
    // Check if input is empty
    if (!input.trim()) {
      document.getElementById("textOutput").value = "";
      return;
    }
    try {
      document.getElementById("textOutput").value = atob(input);
    } catch (e) {
      alert("Invalid Base64 string.");
    }
  }

  function swapText() {
    const input = document.getElementById("textInput");
    const output = document.getElementById("textOutput");
    const temp = input.value;
    input.value = output.value;
    output.value = temp;
  }

  function clearText() {
    document.getElementById("textInput").value = "";
    document.getElementById("textOutput").value = "";
  }

  function convertFile() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      const result = e.target.result;
      document.getElementById("fileOutput").value = result;

      // If image, show preview
      if (file.type.startsWith("image/")) {
        document.getElementById("previewArea").classList.remove("d-none");
        document.getElementById("imgPreview").src = result;
      } else {
        document.getElementById("previewArea").classList.add("d-none");
      }
    };
    reader.readAsDataURL(file);
  }

  function copyFileOutput() {
    const text = document.getElementById("fileOutput");
    text.select();
    navigator.clipboard.writeText(text.value);
  }
</script>
{% endblock %}
